# /etc/nginx/sites-available/agrorent.uz
# HTTPS (443) bloklarini certbot --nginx avtomatik qo'shadi.

upstream agrorent_app {
    server unix:/run/agrorent/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name agrorent.uz www.agrorent.uz;

    client_max_body_size 20M;

    location /api/static/ {
        alias /opt/agrorent/app/agroRent/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /api/media/ {
        alias /opt/agrorent/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://agrorent_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
