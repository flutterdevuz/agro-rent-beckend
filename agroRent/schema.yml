components:
  schemas:
    Category:
      type: object
      description: |-
        Mixin to automatically translate specified fields in a serializer.
        The serializer should define 'translatable_fields' in its Meta class.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
    ContentTypeEnum:
      enum:
      - banner
      - popular_equipment
      type: string
      description: |-
        * `banner` - Banner
        * `popular_equipment` - Ommabop texnika
    FCMToken:
      type: object
      properties:
        token:
          type: string
          title: FCM Token
      required:
      - token
    HomeContent:
      type: object
      description: |-
        Mixin to automatically translate specified fields in a serializer.
        The serializer should define 'translatable_fields' in its Meta class.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        content_type:
