          readOnly: true
          title: Type
        name:
          type: string
          maxLength: 255
        description:
          type: string
        image:
          type: string
          format: uri
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          nullable: true
        market_item:
          type: string
          format: uuid
          nullable: true
      required:
      - content_type
