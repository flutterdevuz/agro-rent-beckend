{% extends 'base.html' %}

{% block title %}Kategoriyalar - Agro Rent Admin{% endblock %}

{% block content %}
<div class="content-card">
    <div class="card-header">
        <h2>Kategoriyalar boshqaruvi</h2>
        <button class="btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Yangi qo'shish</button>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nomi</th>
                    <th>Yaratilgan vaqti</th>
                    <th>Amallar</th>
                </tr>
            </thead>
            <tbody id="data-body">
                <tr><td colspan="4" style="text-align:center">Yuklanmoqda...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Modal -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Yangi Kategoriya qo'shish</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="addForm">
            <div class="form-group">
                <label>Kategoriya nomi</label>
                <input type="text" name="name" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
                <button type="submit" class="btn-primary">Saqlash</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Kategoriyani tahrirlash</h3>
            <span class="close" onclick="closeEditModal()">&times;</span>
        </div>
        <form id="editForm">
            <input type="hidden" id="edit_id" name="id">
            <div class="form-group">
                <label>Kategoriya nomi</label>
                <input type="text" id="edit_name" name="name" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeEditModal()">Bekor qilish</button>
                <button type="submit" class="btn-primary">Saqlash</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let currentCategories = [];

async function loadData() {
    try {
        const response = await apiFetch('/api/market/categories/');
        const data = await response.json();
        const body = document.getElementById('data-body');
        body.innerHTML = '';
        currentCategories = data.results || data;
        currentCategories.forEach(item => {
            const date = item.created_at ? new Date(item.created_at).toLocaleString() : '-';
            body.innerHTML += `
                <tr>
                    <td><small>${item.id}</small></td>
                    <td><strong>${item.name}</strong></td>
                    <td>${date}</td>
                    <td>
                        <button onclick="openEditModal('${item.id}')" class="btn-action btn-edit"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteCategory('${item.id}')" class="btn-action btn-delete" style="color: #ef4444; background: #fee2e2; border: none; cursor: pointer;"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    } catch (error) { console.error(error); }
}

async function deleteCategory(id) {
    if (!confirm("Haqiqatan ham ushbu kategoriyani o'chirmoqchimisiz?")) return;
    try {
        const response = await apiFetch(`/api/market/categories/${id}/`, {
            method: 'DELETE',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        if (response.ok) { loadData(); }
        else { alert("O'chirishda xatolik yuz berdi!"); }
    } catch (error) { console.error(error); }
}

function openModal() { document.getElementById('addModal').style.display = 'block'; }
function closeModal() { document.getElementById('addModal').style.display = 'none'; }

document.getElementById('addForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    try {
        const response = await apiFetch('/api/market/categories/', {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        if (response.ok) { closeModal(); loadData(); e.target.reset(); }
        else { alert('Xatolik!'); }
    } catch (error) { console.error(error); }
};

function openEditModal(id) {
    const item = currentCategories.find(c => c.id === id);
    if (!item) return;
    document.getElementById('edit_id').value = item.id;
    document.getElementById('edit_name').value = item.name;
    document.getElementById('editModal').style.display = 'block';
}
function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

document.getElementById('editForm').onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById('edit_id').value;
    const formData = new FormData(e.target);
    try {
        const response = await apiFetch(`/api/market/categories/${id}/`, {
            method: 'PATCH',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        if (response.ok) { closeEditModal(); loadData(); e.target.reset(); }
        else { alert('Xatolik!'); }
    } catch (error) { console.error(error); }
};

loadData();
</script>
{% endblock %}
