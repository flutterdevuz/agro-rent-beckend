{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash - Agro Rent</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-card {
            background: #fff;
            padding: 50px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; opacity: 0.7; }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: var(--radius-md);
            border: 1px solid #ddd;
            font-size: 16px;
            transition: var(--trans);
        }
        .form-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-light); }
    </style>
</head>
<body>
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 40px;">
            <a href="/" class="logo" style="justify-content: center; margin-bottom: 20px;">
                <i class="fas fa-tractor"></i>
                <span>Agro Rent</span>
            </a>
            <h2 data-i18n>Parolni tiklash</h2>
            <p style="opacity: 0.6;" data-i18n>Telefon raqamingizni kiriting, biz sizga yordam beramiz.</p>
        </div>

        <form id="forgot-form">
            <div class="form-group">
                <label data-i18n>Telefon raqam</label>
                <input type="text" id="phone_number" placeholder="+998 90 123 45 67" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;" data-i18n>
                So'rov yuborish
            </button>
        </form>

        <div style="text-align: center; margin-top: 30px; font-size: 14px;">
            <a href="/login/" style="color: var(--primary); font-weight: 700; text-decoration: none;" data-i18n>
                <i class="fas fa-arrow-left"></i> Kirish sahifasiga qaytish
            </a>
        </div>
    </div>

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'Yuborilmoqda...';

            const phone = document.getElementById('phone_number').value;

            try {
                const res = await window.apiService.request('/users/reset-password/', {
                    method: 'POST',
                    body: JSON.stringify({ phone_number: phone })
                });
                
                window.utils.showNotification(res.result || 'So\'rov yuborildi!');
                setTimeout(() => window.location.href = '/api/admin/login/', 3000);
            } catch (err) {
                window.utils.showNotification(err.data?.error || 'Xatolik yuz berdi', 'danger');
                btn.disabled = false;
                btn.innerText = 'So\'rov yuborildi';
            }
        });
    </script>
</body>
</html>
