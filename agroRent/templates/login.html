{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | AgroTerra</title>
    <link rel="stylesheet" href="{% static 'css/agroterra.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--at-bg);
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            animation: authFadeUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes authFadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-control {
            width: 100%;
            padding: 16px 20px;
            border-radius: var(--at-radius-sm);
            border: 1px solid var(--at-border);
            background: #fff;
            font-family: inherit;
            font-size: 15px;
            transition: var(--at-trans);
            margin-bottom: 24px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--at-primary);
            box-shadow: 0 0 0 4px rgba(1, 45, 29, 0.05);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--at-text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .error-text {
            color: var(--at-danger);
            font-size: 13px;
            margin-top: -16px;
            margin-bottom: 24px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 56px;">
            <a href="/" style="display: inline-flex; align-items: center; gap: 16px; text-decoration: none; margin-bottom: 32px;">
                <div style="width: 56px; height: 56px; background: var(--at-primary); border-radius: var(--at-radius-sm); display: flex; align-items: center; justify-content: center; color: #fff;">
                    <i class="fas fa-leaf" style="font-size: 24px;"></i>
                </div>
            </a>
            <h1 style="font-size: 32px; margin-bottom: 12px;" data-i18n>Welcome Back</h1>
            <p style="color: var(--at-text-secondary);" data-i18n>Sign in to access your AgroTerra fleet dashboard.</p>
        </div>

        <div class="at-card">
            <form id="at-login-form">
                <div>
                    <label data-i18n>Phone Number</label>
                    <input type="text" id="phone_number" class="form-control" placeholder="998901234567" required>
                </div>
                <div>
                    <label data-i18n>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <div id="at-login-error" class="error-text" data-i18n>Invalid credentials. Please try again.</div>

                <button type="submit" class="at-btn at-btn-primary" style="width: 100%; justify-content: center; margin-bottom: 24px;" id="at-login-btn" data-i18n>
                    Access Platform
                </button>

                <div style="text-align: center; font-size: 14px;">
                    <a href="/forgot-password/" style="color: var(--at-text-secondary); text-decoration: none; display: block; margin-bottom: 16px;" data-i18n>Lost access to your account?</a>
                    <div style="color: var(--at-text-secondary);">
                        <span data-i18n>New to AgroTerra?</span>
                        <a href="/register/" style="color: var(--at-primary); font-weight: 700; text-decoration: none;" data-i18n>Create Profile</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="{% static 'js/agroterra/core/api.js' %}"></script>
    <script src="{% static 'js/agroterra/core/auth.js' %}"></script>
    <script>
        document.getElementById('at-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('at-login-btn');
            const error = document.getElementById('at-login-error');
            
            btn.disabled = true;
            btn.innerText = 'Verifying...';
            error.style.display = 'none';

            const credentials = {
                phone_number: document.getElementById('phone_number').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await window.atAuth.login(credentials);
                if (res.user.is_staff) {
                    window.location.href = '/admin/';
                } else {
                    window.location.href = '/profile/';
                }
            } catch (err) {
                error.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Access Platform';
            }
        });
    </script>
</body>
</html>
