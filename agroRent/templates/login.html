<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agro Rent Admin</title>
    <link rel="stylesheet" href="/api/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card .logo {
            font-size: 2.5rem;
            color: #0ea5e9;
            margin-bottom: 1rem;
        }
        .login-card h2 {
            margin-bottom: 0.5rem;
            color: #1e293b;
        }
        .login-card p {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #475569;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-login:hover {
            background: #0284c7;
        }
        .error-msg {
            color: #ef4444;
            margin-top: 1rem;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><i class="fas fa-tractor"></i></div>
        <h2>Xush kelibsiz!</h2>
        <p>Agro Rent Admin paneliga kirish uchun ma'lumotlarni kiriting</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Telefon raqami</label>
                <input type="text" name="phone_number" placeholder="998901234567" required>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Kirish</button>
            <div id="errorMsg" class="error-msg">Telefon raqami yoki parol noto'g'ri!</div>
        </form>
    </div>

    <script>
        // If already logged in, redirect to admin
        if (localStorage.getItem('admin_token')) {
            window.location.href = '/admin/';
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/users/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.user && result.user.is_staff) {
                        localStorage.setItem('admin_token', result.access);
                        localStorage.setItem('admin_user', JSON.stringify(result.user));
                        window.location.href = '/admin/';
                    } else {
                        errorMsg.innerText = "Sizda admin huquqi yo'q!";
                        errorMsg.style.display = 'block';
                    }
                } else {
                    errorMsg.innerText = "Telefon raqami yoki parol noto'g'ri!";
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.innerText = "Server bilan bog'lanishda xatolik!";
                errorMsg.style.display = 'block';
            }
        };
    </script>
</body>
</html>
