{% extends 'base.html' %}

{% block title %}Bannerlar - Agro Rent Admin{% endblock %}

{% block content %}
<div class="content-card">
    <div class="card-header">
        <h2>Bannerlar boshqaruvi</h2>
        <button class="btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Yangi qo'shish</button>
    </div>
    
    <div class="table-container">
        <table id="banners-table">
            <thead>
                <tr>
                    <th>Rasm</th>
                    <th>Nomi</th>
                    <th>Tavsif</th>
                    <th>Amallar</th>
                </tr>
            </thead>
            <tbody id="banners-body">
                <tr><td colspan="4" style="text-align:center">Yuklanmoqda...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Modal -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Yangi Banner qo'shish</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="addForm">
            <div class="form-group">
                <label>Nomi</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Tavsif</label>
                <textarea name="description" required></textarea>
            </div>
            <div class="form-group">
                <label>Rasm</label>
                <input type="file" name="image" accept="image/*" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
                <button type="submit" class="btn-primary">Saqlash</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
async function loadBanners() {
    try {
        const response = await fetch('/api/banners/');
        const data = await response.json();
        const body = document.getElementById('banners-body');
        body.innerHTML = '';
        const items = data.results || data;
        items.forEach(item => {
            body.innerHTML += `
                <tr>
                    <td><img src="${item.image}" class="banner-img"></td>
                    <td>${item.name}</td>
                    <td>${item.description.substring(0, 50)}...</td>
                    <td>
                        <a href="/django-admin/home/homecontent/${item.id}/change/" class="btn-action btn-edit"><i class="fas fa-edit"></i></a>
                        <button onclick="deleteBanner('${item.id}')" class="btn-action btn-delete" style="color: #ef4444; background: #fee2e2; border: none; cursor: pointer;"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    } catch (error) { console.error(error); }
}

async function deleteBanner(id) {
    if (!confirm("Haqiqatan ham ushbu bannerni o'chirmoqchimisiz?")) return;
    try {
        const response = await fetch(`/api/banners/${id}/`, {
            method: 'DELETE',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        if (response.ok) { loadBanners(); }
        else { alert("O'chirishda xatolik yuz berdi!"); }
    } catch (error) { console.error(error); }
}

function openModal() { document.getElementById('addModal').style.display = 'block'; }
function closeModal() { document.getElementById('addModal').style.display = 'none'; }

document.getElementById('addForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    try {
        const response = await fetch('/api/banners/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        });
        if (response.ok) {
            closeModal();
            loadBanners();
            e.target.reset();
        } else {
            alert('Xatolik yuz berdi!');
        }
    } catch (error) { console.error(error); }
};

loadBanners();
</script>
{% endblock %}
