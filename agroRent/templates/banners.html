{% extends 'base.html' %}

{% block title %}Bannerlar - Agro Rent Admin{% endblock %}

{% block content %}
<div class="content-card">
    <div class="card-header">
        <h2>Bannerlar boshqaruvi</h2>
        <button class="btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Yangi qo'shish</button>
    </div>
    
    <div class="table-container">
        <table id="banners-table">
            <thead>
                <tr>
                    <th>Rasm</th>
                    <th>Nomi</th>
                    <th>Tavsif</th>
                    <th>Amallar</th>
                </tr>
            </thead>
            <tbody id="banners-body">
                <tr><td colspan="4" style="text-align:center">Yuklanmoqda...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Modal -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Yangi Banner qo'shish</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="addForm">
            <div class="form-group">
                <label>Nomi</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Tavsif</label>
                <textarea name="description" required></textarea>
            </div>
            <div class="form-group">
                <label>Rasm</label>
                <input type="file" name="image" accept="image/*" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">Bekor qilish</button>
                <button type="submit" class="btn-primary">Saqlash</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Bannerni tahrirlash</h3>
            <span class="close" onclick="closeEditModal()">&times;</span>
        </div>
        <form id="editForm">
            <input type="hidden" id="edit_id" name="id">
            <div class="form-group">
                <label>Nomi</label>
                <input type="text" id="edit_name" name="name" required>
            </div>
            <div class="form-group">
                <label>Tavsif</label>
                <textarea id="edit_description" name="description" required></textarea>
            </div>
            <div class="form-group">
                <label>Yangi Rasm (ixtiyoriy)</label>
                <input type="file" name="image" accept="image/*">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeEditModal()">Bekor qilish</button>
                <button type="submit" class="btn-primary">Saqlash</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let currentBanners = [];

async function loadBanners() {
    try {
        const response = await apiFetch('/api/banners/');
        const data = await response.json();
        const body = document.getElementById('banners-body');
        body.innerHTML = '';
        currentBanners = data.results || data;
        currentBanners.forEach(item => {
            body.innerHTML += `
                <tr>
                    <td><img src="${item.image}" class="banner-img"></td>
                    <td>${item.name}</td>
                    <td>${item.description.substring(0, 50)}...</td>
                    <td>
                        <button onclick="openEditModal('${item.id}')" class="btn-action btn-edit"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteBanner('${item.id}')" class="btn-action btn-delete" style="color: #ef4444; background: #fee2e2; border: none; cursor: pointer;"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    } catch (error) { console.error(error); }
}

async function deleteBanner(id) {
    if (!confirm("Haqiqatan ham ushbu bannerni o'chirmoqchimisiz?")) return;
    try {
        const response = await apiFetch(`/api/banners/${id}/`, {
            method: 'DELETE',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        if (response.ok) { loadBanners(); }
        else { alert("O'chirishda xatolik yuz berdi!"); }
    } catch (error) { console.error(error); }
}

function openModal() { document.getElementById('addModal').style.display = 'block'; }
function closeModal() { document.getElementById('addModal').style.display = 'none'; }

document.getElementById('addForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    try {
        const response = await apiFetch('/api/banners/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        });
        if (response.ok) {
            closeModal();
            loadBanners();
            e.target.reset();
        } else {
            alert('Xatolik yuz berdi!');
        }
    } catch (error) { console.error(error); }
};

function openEditModal(id) {
    const item = currentBanners.find(b => b.id === id);
    if (!item) return;
    document.getElementById('edit_id').value = item.id;
    document.getElementById('edit_name').value = item.name;
    document.getElementById('edit_description').value = item.description;
    document.getElementById('editModal').style.display = 'block';
}
function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

document.getElementById('editForm').onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById('edit_id').value;
    const formData = new FormData(e.target);
    // remove empty image
    if (!formData.get('image').name) formData.delete('image');
    try {
        const response = await apiFetch(`/api/banners/${id}/`, {
            method: 'PATCH',
            body: formData,
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        });
        if (response.ok) {
            closeEditModal();
            loadBanners();
            e.target.reset();
        } else {
            alert('Xatolik yuz berdi!');
        }
    } catch (error) { console.error(error); }
};

loadBanners();
</script>
{% endblock %}
